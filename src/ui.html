<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Graveyard</title>
<style>
  :root { --bg:#0e1116; --fg:#d7dde5; --dim:#7d8896; --stone:#3a424d; --stone2:#4a5460; --fresh:#6fcf97; --weathered:#e5c07b; --crumbling:#e06c75; --overdue:#c678dd; --safe:#56b6c2; }
  * { box-sizing:border-box; }
  body { margin:0; background:radial-gradient(ellipse at 50% -20%, #1d2430, var(--bg) 60%); color:var(--fg); font:14px/1.45 ui-monospace,Menlo,Consolas,monospace; min-height:100vh; }
  header { padding:28px 32px 8px; }
  h1 { margin:0; font-size:26px; letter-spacing:.08em; }
  .repo { color:var(--dim); margin-top:4px; word-break:break-all; }
  nav { padding:14px 32px; display:flex; gap:8px; flex-wrap:wrap; }
  nav button { background:transparent; color:var(--dim); border:1px solid var(--stone); border-radius:999px; padding:5px 14px; cursor:pointer; font:inherit; }
  nav button.on { color:var(--fg); border-color:var(--fg); }
  main { padding:8px 32px 60px; display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:22px; }
  .tomb { position:relative; background:linear-gradient(#1a2029,#151a21); border:1px solid #222a35; border-radius:10px; padding:14px 14px 16px; }
  .tomb svg { display:block; margin:0 auto 6px; }
  .title { font-weight:700; word-break:break-word; margin:4px 0; }
  .meta { color:var(--dim); font-size:12px; }
  .meta b { color:var(--fg); font-weight:400; }
  .pill { display:inline-block; font-size:11px; padding:1px 9px; border-radius:999px; border:1px solid currentColor; margin-bottom:6px; }
  .fresh{color:var(--fresh)} .weathered{color:var(--weathered)} .crumbling{color:var(--crumbling)} .overdue{color:var(--overdue)} .safe{color:var(--safe)}
  .files { margin:6px 0 0; padding:0; list-style:none; color:var(--dim); font-size:12px; max-height:3.9em; overflow:hidden; }
  button.raise { margin-top:12px; width:100%; background:#232b36; color:var(--fg); border:1px solid #384252; border-radius:6px; padding:8px; cursor:pointer; font:inherit; }
  button.raise:hover { background:#2b3541; }
  button.raise:disabled { opacity:.5; cursor:default; }
  .done { margin-top:12px; color:var(--fresh); font-size:12px; word-break:break-all; }
  .err { margin-top:12px; color:var(--crumbling); font-size:12px; }
  .empty { grid-column:1/-1; text-align:center; color:var(--dim); padding:60px 0; }
  .ghostfig { animation:float 4s ease-in-out infinite; }
  @keyframes float { 50% { transform:translateY(-4px); } }
  @media (prefers-reduced-motion: reduce) { .ghostfig { animation:none; } }
</style>
</head>
<body>
<header><h1>GRAVEYARD</h1><div class="repo" id="repo">reading the crypt...</div></header>
<nav id="tabs"></nav>
<main id="grid"></main>
<script>
const TOKEN = '__TOKEN__';
const KINDS = ['all', 'commit', 'stash', 'ghost', 'ward'];
const LABEL = { commit:'lost commits', stash:'stashes', ghost:'ghosts', ward:'wards', all:'all' };
const CRACKS = { fresh:0, weathered:1, crumbling:3, overdue:5, safe:0 };
const DAY = 864e5;
let data = null, tab = 'all';

const el = (tag, props = {}, ...kids) => {
  const e = Object.assign(document.createElement(tag), props);
  for (const k of kids) e.append(k);
  return e;
};
const NS = 'http://www.w3.org/2000/svg';
const svg = (tag, attrs = {}) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };

function ago(ms) {
  const d = Math.max(0, data.now - ms);
  if (d < 6e4) return 'just now';
  if (d < 36e5) return Math.floor(d / 6e4) + 'm ago';
  if (d < DAY) return Math.floor(d / 36e5) + 'h ago';
  return Math.floor(d / DAY) + 'd ago';
}
function left(t) {
  if (t.deadline == null) return 'kept until you delete it';
  const r = t.deadline - data.now;
  if (r <= 0) return 'git may delete it any time';
  return r < DAY ? Math.max(1, Math.floor(r / 36e5)) + 'h left' : Math.floor(r / DAY) + 'd left';
}

function figure(t) {
  const s = svg('svg', { width:120, height:120, viewBox:'0 0 120 120' });
  if (t.kind === 'ghost') {
    s.setAttribute('class', 'ghostfig');
    s.append(svg('path', { d:'M30 100 V50 a30 30 0 0 1 60 0 V100 l-10 -9 l-10 9 l-10 -9 l-10 9 l-10 -9 z', fill:'#c9d3df', opacity:'0.8' }));
    s.append(svg('circle', { cx:48, cy:50, r:5, fill:'#0e1116' }), svg('circle', { cx:72, cy:50, r:5, fill:'#0e1116' }));
    s.append(svg('ellipse', { cx:60, cy:68, rx:6, ry:8, fill:'#0e1116' }));
    return s;
  }
  if (t.kind === 'ward') {
    s.append(svg('path', { d:'M60 12 L98 26 V58 C98 82 80 98 60 108 C40 98 22 82 22 58 V26 Z', fill:'#1f3b44', stroke:'#56b6c2', 'stroke-width':3 }));
    s.append(svg('path', { d:'M42 60 l12 12 l24 -26', fill:'none', stroke:'#56b6c2', 'stroke-width':6, 'stroke-linecap':'round', 'stroke-linejoin':'round' }));
    return s;
  }
  const crack = CRACKS[t.health] || 0;
  const stone = t.health === 'overdue' ? '#2c2f36' : '#4a5460';
  s.append(svg('path', { d:'M26 108 V48 a34 34 0 0 1 68 0 V108 Z', fill:stone, stroke:'#2a313b', 'stroke-width':2 }));
  s.append(svg('rect', { x:14, y:106, width:92, height:8, rx:3, fill:'#2a313b' }));
  if (t.kind === 'stash') {
    s.append(svg('rect', { x:44, y:42, width:32, height:26, rx:3, fill:'none', stroke:'#c9d3df', 'stroke-width':3 }));
    s.append(svg('path', { d:'M44 52 H76', stroke:'#c9d3df', 'stroke-width':3 }));
  } else {
    s.append(svg('path', { d:'M60 30 V70 M44 44 H76', stroke:'#c9d3df', 'stroke-width':5, 'stroke-linecap':'round' }));
  }
  const paths = ['M40 108 L46 90 L40 80', 'M84 70 L74 82 L82 96', 'M52 30 L60 42 L54 52', 'M70 100 L66 88 L74 80', 'M30 62 L40 66'];
  for (let i = 0; i < crack; i++) s.append(svg('path', { d:paths[i], fill:'none', stroke:'#12161c', 'stroke-width':2.5 }));
  return s;
}

function card(t) {
  const c = el('div', { className:'tomb' });
  c.append(figure(t));
  c.append(el('span', { className:'pill ' + t.health, textContent: t.kind === 'ward' ? 'safe snapshot' : t.health + ', ' + left(t) }));
  c.append(el('div', { className:'title', textContent:t.title }));
  const m = el('div', { className:'meta' });
  const row = (k, v) => { m.append(el('div', {}, k + ' ', el('b', { textContent:v }))); };
  row(t.kind === 'ward' ? 'saved' : 'died', ago(t.died));
  if (t.killer) row('killed by', t.killer);
  if (t.kind === 'commit' && t.commits > 1) row('size', t.commits + ' commits');
  if (t.kind === 'ghost') {
    row('size', t.size + ' bytes');
    row('seance', t.guess ? 'looks like ' + t.guess.path + ' (' + t.guess.score + '%)' : 'nameless');
  }
  row('id', t.id);
  c.append(m);
  if (t.files && t.files.length) {
    const ul = el('ul', { className:'files' });
    for (const f of t.files.slice(0, 3)) ul.append(el('li', { textContent:f }));
    if (t.files.length > 3) ul.append(el('li', { textContent:'+ ' + (t.files.length - 3) + ' more' }));
    c.append(ul);
  }
  const b = el('button', { className:'raise', textContent:'Raise on a new branch' });
  const out = el('div');
  b.onclick = async () => {
    b.disabled = true;
    out.className = ''; out.textContent = '';
    try {
      const r = await fetch('/api/revive', { method:'POST', headers:{ 'x-graveyard-token':TOKEN, 'content-type':'application/json' }, body:JSON.stringify({ id:t.id }) });
      const j = await r.json();
      if (!r.ok) throw new Error(j.error);
      out.className = 'done';
      out.textContent = 'Raised on branch ' + j.branch + '. Run: git switch ' + j.branch;
    } catch (e) {
      out.className = 'err'; out.textContent = e.message; b.disabled = false;
    }
  };
  c.append(b, out);
  return c;
}

function render() {
  const tabs = document.getElementById('tabs');
  tabs.replaceChildren(...KINDS.map((k) => {
    const n = k === 'all' ? data.tombstones.length : data.tombstones.filter((t) => t.kind === k).length;
    const b = el('button', { textContent:LABEL[k] + ' ' + n, className:k === tab ? 'on' : '' });
    b.onclick = () => { tab = k; render(); };
    return b;
  }));
  const list = data.tombstones.filter((t) => tab === 'all' || t.kind === tab);
  document.getElementById('grid').replaceChildren(...(list.length ? list.map(card) : [el('div', { className:'empty', textContent:'Nothing here. The graveyard is quiet.' })]));
}

async function load() {
  const r = await fetch('/api/tombs');
  data = await r.json();
  document.getElementById('repo').textContent = data.repo;
  render();
}
load().catch((e) => { document.getElementById('repo').textContent = 'error: ' + e.message; });
</script>
</body>
</html>
