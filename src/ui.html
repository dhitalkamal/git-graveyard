<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Graveyard</title>
<style>
  :root { --fg:#d7dde5; --dim:#7d8896; --fresh:#6fcf97; --weathered:#e5c07b; --crumbling:#e06c75; --overdue:#c678dd; --safe:#56b6c2; }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  html, body { margin:0; height:100%; overflow:hidden; background:#05070b; color:var(--fg); font:13px/1.45 ui-monospace,Menlo,Consolas,monospace; }
  canvas#scene { position:fixed; inset:0; width:100%; height:100%; display:block; outline:none; }
  .hud { position:fixed; left:0; right:0; top:0; padding:18px 24px; display:flex; gap:20px; align-items:flex-start; justify-content:space-between; pointer-events:none; }
  .hud > * { pointer-events:auto; }
  h1 { margin:0; font-size:22px; letter-spacing:.14em; text-shadow:0 0 18px rgba(160,185,235,.45); }
  .repo { color:var(--dim); margin-top:2px; max-width:46vw; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tabs { display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; }
  .tabs button, .ctl button { background:rgba(20,26,36,.72); color:var(--dim); border:1px solid #2b3442; border-radius:999px; padding:5px 13px; cursor:pointer; font:inherit; backdrop-filter:blur(4px); }
  .tabs button.on { color:var(--fg); border-color:#8fa0b8; }
  .filters { display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; margin-top:8px; align-items:center; }
  .filters button { background:rgba(20,26,36,.72); color:var(--dim); border:1px solid #2b3442; border-radius:999px; padding:4px 12px; cursor:pointer; font:inherit; font-size:12px; backdrop-filter:blur(4px); }
  .filters button.on.dying { color:#ffd0d4; border-color:#e06c75; background:rgba(90,31,39,.75); }
  .filters button.on.big { color:#ffe8b0; border-color:#e5c07b; background:rgba(80,62,20,.7); }
  .filters button.on.sort { color:var(--fg); border-color:#8fa0b8; }
  .filters .sep { color:#3a4454; margin:0 4px; }
  .filters .lbl { color:var(--dim); font-size:12px; }
  .hint { position:fixed; left:24px; bottom:18px; color:var(--dim); display:flex; gap:12px; align-items:center; }
  .legend { position:fixed; left:24px; bottom:52px; display:flex; gap:14px; color:var(--dim); font-size:12px; }
  .legend i { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:5px; }
  .panel { position:fixed; right:18px; top:78px; bottom:18px; width:min(420px, 92vw); background:rgba(12,16,23,.93); border:1px solid #263041; border-radius:12px; display:flex; flex-direction:column; backdrop-filter:blur(8px); transform:translateX(120%); transition:transform .25s ease, width .25s ease; }
  .panel.open { transform:none; }
  .panel.wide { width:min(920px, 72vw); }
  .ph { padding:16px 18px 0; position:relative; }
  .kind { font-size:11px; letter-spacing:.12em; color:var(--dim); text-transform:uppercase; }
  .panel h2 { margin:4px 0 8px; font-size:16px; word-break:break-word; padding-right:24px; }
  .pill { display:inline-block; font-size:11px; padding:1px 9px; border-radius:999px; border:1px solid currentColor; margin:0 6px 6px 0; }
  .fresh{color:var(--fresh)} .weathered{color:var(--weathered)} .crumbling{color:var(--crumbling)} .overdue{color:var(--overdue)} .safe{color:var(--safe)}
  .close { position:absolute; right:12px; top:10px; background:none; border:0; color:var(--dim); font:inherit; cursor:pointer; font-size:16px; }
  .ptabs { display:flex; gap:4px; margin-top:8px; border-bottom:1px solid #263041; }
  .ptabs button { background:none; border:0; border-bottom:2px solid transparent; color:var(--dim); padding:8px 10px; font:inherit; cursor:pointer; }
  .ptabs button.on { color:var(--fg); border-bottom-color:#8fa0b8; }
  .pb { flex:1; overflow:auto; padding:12px 18px; }
  .pf { padding:12px 18px 16px; border-top:1px solid #263041; }
  .facts { display:grid; grid-template-columns:auto 1fr; gap:4px 12px; margin:0; }
  .facts dt { color:var(--dim); } .facts dd { margin:0; word-break:break-word; }
  h3 { font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--dim); margin:18px 0 6px; font-weight:400; }
  .clist { list-style:none; margin:0; padding:0; }
  .clist li { display:flex; gap:8px; padding:3px 0; } .clist code { color:#e5c07b; flex:none; }
  .clist .when { color:var(--dim); margin-left:auto; flex:none; }
  .flist { list-style:none; margin:0; padding:0; }
  .flist li { display:grid; grid-template-columns:1fr auto 60px; gap:8px; align-items:center; padding:3px 4px; border-radius:4px; cursor:pointer; }
  .flist li:hover { background:#1a222d; }
  .flist .p { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; direction:rtl; text-align:left; }
  .flist .n { font-size:12px; } .add { color:#7ee2a0; } .del { color:#f08a93; }
  .bar { height:6px; border-radius:3px; background:#263041; overflow:hidden; display:flex; }
  .bar i { display:block; height:100%; } .bar .a { background:#4fbf7a; } .bar .d { background:#d9606b; }
  .note { color:var(--dim); font-size:12px; margin-top:8px; }
  .diff { font-size:12px; }
  .diff details { border:1px solid #263041; border-radius:8px; margin-bottom:10px; overflow:hidden; }
  .diff summary { cursor:pointer; padding:7px 10px; background:#151c26; display:flex; gap:10px; list-style:none; }
  .diff summary::-webkit-details-marker { display:none; }
  .diff summary .p { flex:1; word-break:break-all; }
  .diff pre { margin:0; padding:4px 0; overflow:auto; background:#0b0f15; }
  .diff pre div { padding:0 10px; white-space:pre; min-height:1.45em; }
  .diff .l-add { background:rgba(79,191,122,.13); color:#b9f0cb; } .diff .l-del { background:rgba(217,96,107,.14); color:#f6c1c6; }
  .diff .l-hunk { color:#79a8d9; background:#101823; } .diff .l-meta { color:var(--dim); }
  .dmode { display:flex; gap:4px; margin-bottom:10px; }
  .dmode button { background:#151c26; color:var(--dim); border:1px solid #263041; border-radius:6px; padding:4px 10px; font:inherit; font-size:12px; cursor:pointer; }
  .dmode button.on { color:var(--fg); border-color:#8fa0b8; }
  .diff .uni div { display:grid; grid-template-columns:42px 42px 1fr; padding:0; }
  .diff .uni div > span { padding:0 6px; white-space:pre; }
  .diff .no { color:#55606e; text-align:right; user-select:none; border-right:1px solid #1c2531; }
  .diff .sbs { display:grid; grid-template-columns:42px minmax(0,1fr) 42px minmax(0,1fr); padding:4px 0; background:#0b0f15; overflow:auto; }
  .diff .sbs > span { padding:0 6px; white-space:pre; overflow:hidden; text-overflow:ellipsis; min-height:1.45em; }
  .diff .sbs .mid { border-left:1px solid #263041; }
  .diff .sbs .c-del { background:rgba(217,96,107,.16); color:#f6c1c6; } .diff .sbs .c-add { background:rgba(79,191,122,.14); color:#b9f0cb; }
  .diff .sbs .c-empty { background:repeating-linear-gradient(135deg, transparent 0 6px, rgba(255,255,255,.025) 6px 12px); }
  .diff .sbs .c-hunk { color:#79a8d9; background:#101823; grid-column:1 / -1; } .diff .sbs .c-meta { color:var(--dim); grid-column:1 / -1; }
  button.raise { width:100%; background:#22303f; color:var(--fg); border:1px solid #3a4b60; border-radius:8px; padding:10px; cursor:pointer; font:inherit; }
  button.raise:hover { background:#2a3b4e; } button.raise:disabled { opacity:.5; cursor:default; }
  button.bury { width:100%; margin-top:8px; background:transparent; color:#f08a93; border:1px solid #5a2b31; border-radius:8px; padding:8px; cursor:pointer; font:inherit; }
  button.bury:hover { background:#2a1519; } button.bury.armed { background:#5a1f27; color:#fff; border-color:#d9606b; } button.bury:disabled { opacity:.5; cursor:default; }
  .done { margin-top:10px; color:var(--fresh); word-break:break-all; } .err { margin-top:10px; color:var(--crumbling); }
  .tip { position:fixed; pointer-events:none; background:rgba(10,14,20,.94); border:1px solid #2b3442; border-radius:8px; padding:8px 11px; font-size:12px; transform:translate(14px, 14px); max-width:340px; }
  .tip .k { font-size:10px; letter-spacing:.12em; color:var(--dim); text-transform:uppercase; }
  .tip b { display:block; margin:2px 0 4px; } .tip .s { color:var(--dim); } .tip ul { margin:6px 0 0; padding:0; list-style:none; }
  .tip li { display:flex; gap:8px; } .tip li span:first-child { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .center { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; color:var(--dim); pointer-events:none; text-align:center; padding:20px; }
  @media (prefers-reduced-motion: reduce) { .panel { transition:none; } }

<body>
<canvas id="scene" tabindex="0"></canvas>
<div class="hud">
  <div><h1>GRAVEYARD</h1><div class="repo" id="repo">reading the crypt...</div></div>
  <div><div class="tabs" id="tabs"></div><div class="filters" id="filters"></div></div>
</div>
<div class="legend">
  <span><i style="background:var(--fresh)"></i>fresh</span><span><i style="background:var(--weathered)"></i>weathered</span>
  <span><i style="background:var(--crumbling)"></i>crumbling</span><span><i style="background:var(--overdue)"></i>overdue</span><span><i style="background:var(--safe)"></i>ward</span>
</div>
<div class="hint ctl"><span>drag: orbit | right-drag: pan | wheel: zoom | click a grave</span><button id="reset">reset view</button></div>
<div class="tip" id="tip" hidden></div>
<aside class="panel" id="panel"></aside>
<div class="center" id="empty" hidden>Nothing here. The graveyard is quiet.</div>
<div class="center" id="nogl" hidden>This browser could not start WebGL. Try another browser, or run "graveyard" in the terminal for the text list.</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { applyFilters, isBig, isDying, lineCount, BIG_LINES, BIG_FILES } from '/lib/filter.js';

const TOKEN = '__TOKEN__';
const KINDS = ['all', 'commit', 'stash', 'ghost', 'ward'];
const LABEL = { commit:'lost commits', stash:'stashes', ghost:'ghosts', ward:'wards', all:'all' };
const HEALTH_COLOR = { fresh:0x6fcf97, weathered:0xe5c07b, crumbling:0xe06c75, overdue:0xc678dd, safe:0x56b6c2 };
const STONE_COLOR = { fresh:0xa9b3bf, weathered:0x939aa3, crumbling:0x7a7f86, overdue:0x5a5c62, safe:0x58a6b0 };
const CRACKS = { fresh:0, weathered:1, crumbling:3, overdue:5, safe:0 };
const DAY = 864e5;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = (id) => document.getElementById(id);
const el = (tag, props = {}, ...kids) => { const e = Object.assign(document.createElement(tag), props); for (const k of kids) e.append(k); return e; };
const hash = (s) => { let h = 2166136261; for (const c of s) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return h >>> 0; };
const rnd = (seed, n) => ((hash(seed + ':' + n) % 2000) / 1000) - 1;

let data = null, tab = 'all', selected = null;
const filt = { big:false, dying:false, sort:'newest' };

function kindName(t) {
  if (t.kind === 'commit') return /^branch .* deleted$/.test(t.killer || '') ? 'deleted branch' : t.commits > 1 ? 'lost commits' : 'lost commit';
  return { stash:'dropped stash', ghost:'ghost file', ward:'ward snapshot' }[t.kind];
}
const fileCount = (t) => t.stat.files.length + ' file' + (t.stat.files.length === 1 ? '' : 's');

function ago(ms) {
  const d = Math.max(0, data.now - ms);
  if (d < 6e4) return 'just now';
  if (d < 36e5) return Math.floor(d / 6e4) + 'm ago';
  if (d < DAY) return Math.floor(d / 36e5) + 'h ago';
  return Math.floor(d / DAY) + 'd ago';
}
function left(t) {
  if (t.deadline == null) return 'kept until you delete it';
  const r = t.deadline - data.now;
  if (r <= 0) return 'git may delete it any time';
  return r < DAY ? Math.max(1, Math.floor(r / 36e5)) + 'h left' : Math.floor(r / DAY) + 'd left';
}

/* ---------- renderer, scene, camera ---------- */
const canvas = $('scene');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
} catch (e) {
  $('nogl').hidden = false;
  throw e;
}
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.45;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0f1828, 0.032);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 300);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI * 0.47;
controls.minDistance = 3;
controls.maxDistance = 40;
controls.autoRotate = !reduceMotion;
controls.autoRotateSpeed = 0.35;
canvas.addEventListener('pointerdown', () => { controls.autoRotate = false; });

/* sky dome: vertical gradient */
{
  const g = new THREE.SphereGeometry(150, 32, 16);
  const m = new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite:false, fog:false,
    uniforms: { top:{ value:new THREE.Color(0x0a1230) }, mid:{ value:new THREE.Color(0x15203a) }, bot:{ value:new THREE.Color(0x0b1220) } },
    vertexShader: 'varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }',
    fragmentShader: 'uniform vec3 top; uniform vec3 mid; uniform vec3 bot; varying vec3 vP; void main(){ float h = vP.y; vec3 c = h > 0.08 ? mix(mid, top, smoothstep(0.08, 0.7, h)) : mix(bot, mid, smoothstep(-0.1, 0.08, h)); gl_FragColor = vec4(c, 1.); }',
  });
  scene.add(new THREE.Mesh(g, m));
}

/* stars */
{
  const n = 900, pos = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    const th = Math.random() * Math.PI * 2, ph = Math.acos(Math.random() * 0.9 + 0.1);
    pos.set([Math.sin(ph) * Math.cos(th) * 140, Math.cos(ph) * 140, Math.sin(ph) * Math.sin(th) * 140], i * 3);
  }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color:0xdfe8ff, size:0.6, sizeAttenuation:true, fog:false, transparent:true, opacity:0.85 })));
}

/* moon + moonlight */
// the moon you see sits low behind the graves; the light that casts shadows comes from higher up
const MOON_DIR = new THREE.Vector3(-0.42, 0.13, -1).normalize();
const LIGHT_DIR = new THREE.Vector3(-0.5, 0.75, -0.45).normalize();
{
  const moon = new THREE.Mesh(new THREE.SphereGeometry(5, 32, 16), new THREE.MeshBasicMaterial({ color:0xf3f7ff, fog:false }));
  moon.position.copy(MOON_DIR).multiplyScalar(120);
  scene.add(moon);
  const halo = new THREE.Sprite(new THREE.SpriteMaterial({ map:glowTexture('rgba(170,195,255,0.55)'), fog:false, depthWrite:false, transparent:true, blending:THREE.AdditiveBlending }));
  halo.scale.set(40, 40, 1); halo.position.copy(moon.position);
  scene.add(halo);
}
scene.add(new THREE.HemisphereLight(0x9fb4e0, 0x18241b, 1.0));
const fill = new THREE.DirectionalLight(0x9db0d8, 0.9); // soft front light so the engravings read
fill.position.set(6, 9, 14); scene.add(fill);
const moonLight = new THREE.DirectionalLight(0xc8d6ff, 1.6);
moonLight.position.copy(LIGHT_DIR).multiplyScalar(30);
moonLight.castShadow = true;
moonLight.shadow.mapSize.set(2048, 2048);
moonLight.shadow.bias = -0.0008;
moonLight.shadow.normalBias = 0.02;
scene.add(moonLight);

/* ground with gentle bumps */
{
  const g = new THREE.CircleGeometry(60, 120);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i), r = Math.hypot(x, y);
    const h = r < 9 ? 0 : (Math.sin(x * 0.35) * Math.cos(y * 0.3) * 0.35 + Math.sin(x * 0.11 + y * 0.07) * 0.8) * Math.min(1, (r - 9) / 10);
    p.setZ(i, h);
  }
  g.computeVertexNormals();
  const ground = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color:0x1d2b22, roughness:1, map:grassTexture() }));
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);
}

/* dead trees and a fence ring, for mood */
const bark = new THREE.MeshStandardMaterial({ color:0x1b1712, roughness:1 });
function deadTree(x, z, s) {
  const t = new THREE.Group();
  const branch = (len, rad, depth) => {
    const g = new THREE.Group();
    const m = new THREE.Mesh(new THREE.CylinderGeometry(rad * 0.6, rad, len, 6), bark);
    m.position.y = len / 2; m.castShadow = true; g.add(m);
    if (depth > 0) for (let i = 0; i < 2 + (depth > 1 ? 1 : 0); i++) {
      const c = branch(len * 0.68, rad * 0.62, depth - 1);
      c.position.y = len * (0.65 + i * 0.12);
      c.rotation.z = (i % 2 ? 1 : -1) * (0.5 + Math.random() * 0.35);
      c.rotation.y = Math.random() * Math.PI * 2;
      g.add(c);
    }
    return g;
  };
  t.add(branch(2.4 * s, 0.16 * s, 3));
  t.position.set(x, 0, z);
  scene.add(t);
}
deadTree(-11, -8, 1.2); deadTree(12, -10, 1); deadTree(-14, 9, 0.9); deadTree(15, 7, 1.1);

const fence = new THREE.MeshStandardMaterial({ color:0x15181d, roughness:0.6, metalness:0.6 });
let fenceGroup = null;
function buildFence(radius) {
  if (fenceGroup) scene.remove(fenceGroup);
  fenceGroup = new THREE.Group();
  const n = Math.round(radius * 5);
  const bar = new THREE.CylinderGeometry(0.03, 0.03, 1.1, 5);
  const tip = new THREE.ConeGeometry(0.06, 0.16, 5);
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2;
    if (Math.abs(Math.sin(a / 2 - Math.PI / 4)) < 0.035) continue; // a gate gap
    const b = new THREE.Mesh(bar, fence); b.position.set(Math.cos(a) * radius, 0.55, Math.sin(a) * radius); b.castShadow = true;
    const t = new THREE.Mesh(tip, fence); t.position.set(b.position.x, 1.18, b.position.z);
    fenceGroup.add(b, t);
  }
  for (const y of [0.3, 0.9]) {
    const ring = new THREE.Mesh(new THREE.TorusGeometry(radius, 0.025, 4, 160), fence);
    ring.rotation.x = Math.PI / 2; ring.position.y = y; fenceGroup.add(ring);
  }
  scene.add(fenceGroup);
}

/* fireflies */
const fireflies = (() => {
  const n = 70, pos = new Float32Array(n * 3), seed = [];
  for (let i = 0; i < n; i++) { seed.push([Math.random() * 30 - 15, Math.random() * 2 + 0.3, Math.random() * 30 - 15, Math.random() * 10]); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const pts = new THREE.Points(g, new THREE.PointsMaterial({ map:glowTexture('rgba(220,255,170,1)'), color:0xd9ff9a, size:0.35, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending }));
  scene.add(pts);
  return { update(t) {
    for (let i = 0; i < n; i++) { const s = seed[i]; pos.set([s[0] + Math.sin(t * 0.3 + s[3]) * 1.5, s[1] + Math.sin(t * 0.9 + s[3]) * 0.3, s[2] + Math.cos(t * 0.25 + s[3]) * 1.5], i * 3); }
    g.attributes.position.needsUpdate = true;
  } };
})();

/* ---------- textures ---------- */
function glowTexture(color) {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const x = c.getContext('2d'), gr = x.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, color); gr.addColorStop(1, 'rgba(0,0,0,0)');
  x.fillStyle = gr; x.fillRect(0, 0, 128, 128);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
function grassTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const x = c.getContext('2d');
  x.fillStyle = '#2a3b2e'; x.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 5000; i++) {
    const v = 30 + Math.random() * 40;
    x.fillStyle = `rgb(${v * 0.7 | 0},${v | 0},${v * 0.75 | 0})`;
    x.fillRect(Math.random() * 256, Math.random() * 256, 1 + Math.random() * 2, 1 + Math.random() * 3);
  }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(24, 24); t.colorSpace = THREE.SRGBColorSpace; return t;
}
function stoneTexture(seed) {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const x = c.getContext('2d');
  x.fillStyle = '#fff'; x.fillRect(0, 0, 128, 128);
  for (let i = 0; i < 900; i++) {
    const v = 200 + ((hash(seed + i) % 55));
    x.fillStyle = `rgb(${v},${v},${v})`;
    x.fillRect(hash(seed + 'x' + i) % 128, hash(seed + 'y' + i) % 128, 2, 2);
  }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.SRGBColorSpace; return t;
}

function wrap(ctx, text, maxW, maxLines) {
  const words = String(text).split(/\s+/); const out = []; let line = '';
  for (const w of words) {
    const tryL = line ? line + ' ' + w : w;
    if (ctx.measureText(tryL).width > maxW && line) { out.push(line); line = w; } else line = tryL;
    if (out.length === maxLines) break;
  }

  const list = applyFilters(data.tombstones.filter((t) => tab === 'all' || t.kind === tab), { ...filt, now:data.now });
  $('empty').hidden = list.length > 0;

function parsePatch(patch) {
  const files = []; let cur = null;
  for (const line of patch.split('\n')) {
    if (line.startsWith('diff --git ') || line.startsWith('# ')) {
      if (line.startsWith('# ')) { files.push({ name:line.slice(2), lines:[], note:true }); cur = null; continue; }
      const m = line.match(/^diff --git a\/(.*) b\/(.*)$/);
      cur = { name:m ? (m[1] === m[2] ? m[2] : m[1] + ' -> ' + m[2]) : line, lines:[], add:0, del:0 };
      files.push(cur); continue;
    }
    if (!cur) continue;
    if (/^(index |--- |\+\+\+ |new file|deleted file|similarity|rename |old mode|new mode)/.test(line)) { if (/^(new file|deleted file|rename )/.test(line)) cur.lines.push(['meta', line]); continue; }
    if (line.startsWith('@@')) cur.lines.push(['hunk', line]);
    else if (line.startsWith('+')) { cur.lines.push(['add', line]); cur.add++; }
    else if (line.startsWith('-')) { cur.lines.push(['del', line]); cur.del++; }
    else if (line.startsWith('Binary') || line.startsWith('\\')) cur.lines.push(['meta', line]);
    else cur.lines.push(['ctx', line]);
  }
  return files;
}

/* number the lines of one file's diff from its @@ headers */

  return lines.filter(([k, l]) => !(k === 'ctx' && l === '')).map(([k, l]) => {
    if (k === 'hunk') { const m = l.match(/^@@ -(\d+)(?:,\d+)? \+(\d+)/); if (m) { o = +m[1]; n = +m[2]; } return { k, l }; }
    if (k === 'meta') return { k, l };
    if (k === 'del') return { k, l:l.slice(1), o:o++ };
    if (k === 'add') return { k, l:l.slice(1), n:n++ };
    return { k, l:l.slice(1), o:o++, n:n++ };
  });
}

function unified(rows) {

    pre.append(el('div', { className:'l-' + r.k }, el('span', { className:'no', textContent:r.o ?? '' }), el('span', { className:'no', textContent:r.n ?? '' }), el('span', { textContent:sign + r.l })));
  }
  return pre;
}

/* old on the left, new on the right; a run of removed lines pairs up with the added run after it */
function sideBySide(rows) {

  const cell = (cls, text) => el('span', { className:cls, textContent:text ?? '' });
  const pair = (L, R) => {
    grid.append(cell('no', L?.o), cell('code ' + (L ? (L.k === 'del' ? 'c-del' : '') : 'c-empty'), L?.l),
      cell('no mid', R?.n), cell('code ' + (R ? (R.k === 'add' ? 'c-add' : '') : 'c-empty'), R?.l));
  };
  for (let i = 0; i < rows.length; ) {
    const r = rows[i];
    if (r.k === 'hunk' || r.k === 'meta') { grid.append(cell('c-' + r.k, r.l)); i++; continue; }
    if (r.k === 'ctx') { pair(r, r); i++; continue; }
    const dels = [], adds = [];
    while (i < rows.length && rows[i].k === 'del') dels.push(rows[i++]);
    while (i < rows.length && rows[i].k === 'add') adds.push(rows[i++]);
    for (let j = 0; j < Math.max(dels.length, adds.length); j++) pair(dels[j], adds[j]);

function changesView(t, d) {

  };
  box.append(mode);
  if (t.kind === 'ghost' && t.guess) box.append(el('div', { className:'note', textContent:'Left is your current ' + t.guess.path + '. Right is the lost version.' }));
  if (t.kind === 'ward') box.append(el('div', { className:'note', textContent:'Left is your last commit. Right is your work when the ward fired, including files never staged.' }));
  if (t.kind === 'commit') box.append(el('div', { className:'note', textContent:'Left is where the lost work started. Right is the lost work.' }));
  if (t.kind === 'stash') box.append(el('div', { className:'note', textContent:'Left is the commit you stashed on. Right is your stashed changes.' }));
  box.append(files);
  draw();
  if (d.truncated) box.append(el('div', { className:'note', textContent:'Diff cut short: it is very large. Raise it and use git to see the rest.' }));
  return box;
}

function openPanel(t) {
  selected = t.id;
  const o = pickables.find((x) => x.userData.tomb.id === t.id);
  if (o) focusOn(o.position);
  const p = $('panel');
  const close = el('button', { className:'close', textContent:'x', title:'close (Esc)' });
  close.onclick = closePanel;
  const head = el('div', { className:'ph' }, close, el('div', { className:'kind', textContent:kindName(t) }), el('h2', { textContent:t.headline || t.title }),
    el('span', { className:'pill ' + t.health, textContent: t.kind === 'ward' ? 'safe snapshot' : t.health + ', ' + left(t) }),
    el('span', { className:'pill', style:'color:var(--dim)', textContent:t.summary }));
  const tabsEl = el('div', { className:'ptabs' });
  const body = el('div', { className:'pb', textContent:'reading the grave...' });
  head.append(tabsEl);

  let view = 'overview', detail = null;
  const show = (v, fileIndex) => {
    view = v;
    p.classList.toggle('wide', v === 'changes');
    tabsEl.replaceChildren(...[['overview', 'Overview'], ['changes', 'Changes (' + fileCount(t) + ')']].map(([k, label]) => {
      const b = el('button', { textContent:label, className:k === view ? 'on' : '' }); b.onclick = () => show(k); return b;
    }));
    if (!detail) return;
    body.replaceChildren(v === 'overview' ? overview(t, detail, (i) => show('changes', i)) : changesView(t, detail));
    body.scrollTop = 0;
    if (fileIndex != null) body.querySelectorAll('.diff details')[fileIndex]?.scrollIntoView({ block:'start' });
  };
  show('overview');
  getDetail(t).then((d) => { if (selected !== t.id) return; detail = d; show(view); })
    .catch((e) => { body.replaceChildren(el('div', { className:'err', textContent:e.message })); });

  const branchName = 'graveyard/' + (t.kind === 'commit' ? 'commit' : t.kind) + '-' + t.sha.slice(0, 7);
  const b = el('button', { className:'raise', textContent:'Raise on a new branch' });
  const out = el('div', { className:'note', textContent:'Makes branch ' + branchName + '. Your current branch and files stay as they are.' });
  b.onclick = async () => {
    b.disabled = true; out.className = 'note'; out.textContent = 'raising...';
    try {
      const r = await fetch('/api/revive', { method:'POST', headers:{ 'x-graveyard-token':TOKEN, 'content-type':'application/json' }, body:JSON.stringify({ id:t.id }) });
      const j = await r.json();
      if (!r.ok) throw new Error(j.error);
      out.className = 'done';
      out.textContent = 'Raised on branch ' + j.branch + '. Run: git switch ' + j.branch;
      b.textContent = 'Raised';
      if (o) resurrect(o, j.branch);
    } catch (e) { out.className = 'err'; out.textContent = e.message; b.disabled = false; }
  };
  const foot = el('div', { className:'pf' }, b, out);
  if (t.kind === 'ward') {
    // two clicks: the first arms it, the second deletes; arming times out after 4 s
    const del = el('button', { className:'bury', textContent:'Delete this ward' });
    let armed = null;
    del.onclick = async () => {
      if (!armed) {
        del.classList.add('armed'); del.textContent = 'Click again to delete for good';
        armed = setTimeout(() => { armed = null; del.classList.remove('armed'); del.textContent = 'Delete this ward'; }, 4000);
        return;
      }
      clearTimeout(armed); armed = null;
      del.disabled = true; b.disabled = true;
      try {
        const r = await fetch('/api/ward/delete', { method:'POST', headers:{ 'x-graveyard-token':TOKEN, 'content-type':'application/json' }, body:JSON.stringify({ id:t.id }) });
        const j = await r.json();
        if (!r.ok) throw new Error(j.error);
        out.className = 'note';
        out.textContent = 'Deleted ' + j.deleted + '. Undo, until git prunes it: git update-ref ' + j.deleted + ' ' + t.sha;
        del.textContent = 'Deleted';
        if (o) bury(o);
        data.tombstones = data.tombstones.filter((x) => x.id !== t.id);
        renderTabs();
      } catch (e) { out.className = 'err'; out.textContent = e.message; del.disabled = false; b.disabled = false; del.classList.remove('armed'); del.textContent = 'Delete this ward'; }
    };
    foot.append(del);
  }
  p.replaceChildren(head, body, foot);
  p.classList.add('open');
}

/* ---------- tabs ---------- */
function renderTabs() {
  $('tabs').replaceChildren(...KINDS.map((k) => {
    const n = k === 'all' ? data.tombstones.length : data.tombstones.filter((t) => t.kind === k).length;
    const b = el('button', { textContent:LABEL[k] + ' ' + n, className:k === tab ? 'on' : '' });
    b.onclick = () => { tab = k; renderTabs(); buildGraves(); };
    return b;
  }));
  const inTab = data.tombstones.filter((t) => tab === 'all' || t.kind === tab);
  const toggle = (key, label, title) => {
    const n = inTab.filter((t) => (key === 'big' ? isBig(t) : isDying(t, data.now))).length;
    const b = el('button', { className:key + (filt[key] ? ' on' : ''), textContent:label + ' ' + n, title });
    b.onclick = () => { filt[key] = !filt[key]; renderTabs(); buildGraves(); };
    return b;
  };
  const sortBtn = (key, label) => {
    const b = el('button', { className:'sort' + (filt.sort === key ? ' on' : ''), textContent:label });
    b.onclick = () => { filt.sort = key; renderTabs(); buildGraves(); };
    return b;
  };
  $('filters').replaceChildren(
    toggle('dying', 'dying soon', 'git may delete these within 3 days'),
    toggle('big', 'big', BIG_LINES + '+ changed lines or ' + BIG_FILES + '+ files'),
    el('span', { className:'sep', textContent:'|' }), el('span', { className:'lbl', textContent:'front row:' }),
    sortBtn('newest', 'newest'), sortBtn('dying', 'dying first'), sortBtn('biggest', 'biggest'));
  const shown = applyFilters(inTab, { ...filt, now:data.now }).length;
  $('empty').textContent = inTab.length && !shown ? 'No graves match these filters. ' + inTab.length + ' hidden.' : 'Nothing here. The graveyard is quiet.';
}

/* ---------- resurrection ---------- */
const timer = new THREE.Timer();
const clock = { getElapsedTime: () => timer.getElapsed() };
const clamp01 = (v) => Math.max(0, Math.min(1, v));
const span = (a, b, x) => clamp01((x - a) / (b - a));
const smooth = (k) => k * k * (3 - 2 * k);
const pillarGeom = (() => { const g = new THREE.CylinderGeometry(0.8, 0.8, 16, 40, 1, true); g.translate(0, 8, 0); return g; })();

function resurrect(o, branch) {
  const u = o.userData;
  if (u.res) return;
  const g = new THREE.Group();
  const pillar = new THREE.Mesh(pillarGeom, new THREE.ShaderMaterial({
    transparent:true, depthWrite:false, blending:THREE.AdditiveBlending, side:THREE.DoubleSide,
    uniforms:{ opacity:{ value:0 }, color:{ value:new THREE.Color(0xffe2a0) } },
    vertexShader:'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }',
    fragmentShader:'uniform float opacity; uniform vec3 color; varying vec2 vUv; void main(){ float a = pow(1. - vUv.y, 1.6) * opacity; gl_FragColor = vec4(color * a, a); }',
  }));
  const n = 90, pos = new Float32Array(n * 3), seed = [];
  for (let i = 0; i < n; i++) seed.push([Math.random() * Math.PI * 2, 0.2 + Math.random() * 0.7, 0.6 + Math.random() * 1.4, Math.random() * 4]);
  const sg = new THREE.BufferGeometry(); sg.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const sparks = new THREE.Points(sg, new THREE.PointsMaterial({ map:glowTexture('rgba(255,236,170,1)'), color:0xffe8a8, size:0.22, transparent:true, opacity:0, depthWrite:false, blending:THREE.AdditiveBlending }));
  const light = new THREE.PointLight(0xffd88a, 0, 7, 2); light.position.y = 1.4;
  const label = labelSprite('risen on ' + branch, '#ffe6a0'); label.position.y = 2.75; label.material.opacity = 0;
  if (u.label) u.label.visible = false; // the risen label takes the ghost's name tag's place
  g.add(pillar, sparks, light, label);
  o.add(g);
  u.res = { t0:clock.getElapsedTime() - (reduceMotion ? 10 : 0), pillar, sparks, seed, pos, light, label, leanX:u.body.rotation.x, leanZ:u.body.rotation.z };
}

function stepResurrection(o, t) {
  const u = o.userData, r = u.res, tr = t - r.t0;
  const up = smooth(span(0.7, 2.3, tr));
  const shake = tr < 0.9 ? (1 - tr / 0.9) * 0.045 : 0;
  u.body.position.x = Math.sin(t * 70) * shake;
  const bob = tr > 2.3 && !reduceMotion ? Math.sin(t * 1.4) * 0.05 : 0;
  const spin = up * Math.PI * 2;
  if (!u.ghost) { u.body.rotation.set(r.leanX * (1 - up), spin, r.leanZ * (1 - up)); }
  r.pillar.material.uniforms.opacity.value = 0.85 * span(0.25, 1.3, tr) - 0.65 * span(2.3, 3.6, tr);
  r.light.intensity = 3.2 * span(0.25, 1.3, tr) - 2 * span(2.3, 3.6, tr);
  r.label.material.opacity = span(2.0, 2.8, tr);
  r.sparks.material.opacity = Math.min(span(0.4, 1, tr), 1 - 0.6 * span(3.5, 5, tr));
  for (let i = 0; i < r.seed.length; i++) {
    const [a, rad, sp, off] = r.seed[i];
    const h = ((tr * sp + off) % 3.6);
    const ang = a + tr * 1.6 + h;
    r.pos.set([Math.cos(ang) * rad * (1 - h / 5), h, Math.sin(ang) * rad * (1 - h / 5)], i * 3);
  }
  r.sparks.geometry.attributes.position.needsUpdate = true;
  u.glow.material.color.setHex(0xffd88a); u.glow.scale.setScalar(1 + 0.7 * span(0, 1.2, tr));
  return { rise:up * 0.9 + bob, spin };
}

/* a deleted ward sinks into the ground, then leaves the scene */
function bury(o) { o.userData.buriedAt = clock.getElapsedTime() - (reduceMotion ? 10 : 0); }
function stepBurial(o, t) {
  const u = o.userData, k = span(0, 1.6, t - u.buriedAt);
  u.body.position.x = k < 0.5 ? Math.sin(t * 60) * 0.03 * (1 - k * 2) : 0;
  u.body.position.y = u.baseY - smooth(k) * 1.8;
  u.glow.material.opacity = 0.32 * (1 - k);
  if (k >= 1) {
    graves.remove(o);
    pickables = pickables.filter((x) => x !== o);
    if (hovered === o) hovered = null;
  }
}

/* camera glides to the grave you open */
let focus = null;
function focusOn(p) { focus = new THREE.Vector3(p.x, 0.7, p.z); }
canvas.addEventListener('pointerdown', () => { focus = null; });

/* ---------- loop ---------- */
const tmp = new THREE.Vector3();
function tick(now) {
  timer.update(now);
  const t = clock.getElapsedTime();
  for (const o of [...pickables]) {
    if (o.userData.buriedAt != null) { stepBurial(o, t); continue; }
    const u = o.userData, sel = u.tomb.id === selected, hov = o === hovered;
    const res = u.res ? stepResurrection(o, t) : null;
    const lift = res ? res.rise : (sel ? 0.16 : hov ? 0.08 : 0);
    const k = res ? 1 : 0.15; // the resurrection drives the height directly
    if (u.ghost) {
      const bob = reduceMotion || res ? 0 : Math.sin(t * 1.6 + u.phase) * 0.12;
      u.body.position.y += (u.baseY + bob + lift - u.body.position.y) * k;
      tmp.set(camera.position.x, o.position.y, camera.position.z);
      u.body.lookAt(tmp);
      if (res) u.body.rotateY(res.spin);
    } else {
      u.body.position.y += (u.baseY + lift - u.body.position.y) * k;
    }
    for (const m of u.mats) {
      if (u.ghost) m.emissiveIntensity = res ? 1.1 : sel ? 1 : hov ? 0.8 : 0.55;
      else m.emissive.setHex(res ? 0x3a2c0c : sel ? 0x2a3442 : hov ? 0x1a212a : u.emissive);
    }
    u.glow.material.opacity = (u.ghost ? 0.35 : 0.32) + (res ? 0.4 : sel ? 0.35 : hov ? 0.15 : 0) + (reduceMotion ? 0 : Math.sin(t * 2 + o.position.x) * 0.04);
    if (u.dying && !res) {
      u.glow.material.color.setHex(0xff4d5e);
      u.glow.material.opacity += reduceMotion ? 0.25 : 0.2 + Math.sin(t * 4) * 0.18;
    }
  }
  if (focus) {
    const d = focus.clone().sub(controls.target).multiplyScalar(0.08);
    controls.target.add(d); camera.position.add(d);
    if (d.lengthSq() < 1e-7) focus = null;
  }
  if (!reduceMotion) fireflies.update(t);
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
addEventListener('keydown', (e) => { if (e.key === 'Escape') closePanel(); });

async function load() {
  data = await (await fetch('/api/tombs')).json();
  $('repo').textContent = data.repo;
  renderTabs(); buildGraves();
}
load().then(() => {
  window.__graveyardReady = true;
  // ?open=<id>&tab=changes&rise=1 opens a grave on load (used for screenshots and links)
  const q = new URLSearchParams(location.search);
  const t = q.get('open') && data.tombstones.find((x) => x.id === q.get('open'));
  if (t) {
    openPanel(t);
    if (q.get('tab') === 'changes') setTimeout(() => document.querySelectorAll('.ptabs button')[1]?.click(), 300);
    if (q.get('rise')) { const o = pickables.find((x) => x.userData.tomb.id === t.id); if (o) resurrect(o, 'graveyard/preview'); }
  }
}).catch((e) => { $('repo').textContent = 'error: ' + e.message; });
tick();
</script>
</body>
